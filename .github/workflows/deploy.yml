name: Deploy

on:
  # The real file triggers on push; disabled in this probe so the merge does not
  # fire a run before the GCP side (WIF + Artifact Registry) exists.
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for the OIDC token GCP federates against

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keyless. GitHub mints a short-lived OIDC token describing this run;
      # Workload Identity Federation exchanges it for a ~1h GCP token.
      # No service_account: roles are granted directly to the principalSet
      # (current Google guidance — see Deploy_Design.md §3.7).
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STRATA_WIF_PROVIDER }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker ${{ vars.STRATA_AR_HOST }} --quiet

      - name: Build and push
        run: |
          IMAGE="${{ vars.STRATA_AR_HOST }}/${{ vars.STRATA_PROJECT }}/${{ vars.STRATA_AR_REPO }}/app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
